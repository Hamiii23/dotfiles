exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = sleep 1 && systemctl --user restart xdg-desktop-portal-hyprland xdg-desktop-portal

exec-once = waybar
exec-once = swaync
exec-once = nm-applet

exec-once = awww-daemon
exec-once = awww img $(cat ~/.cache/current_wallpaper 2>/dev/null || echo ~/.config/hypr/Wallpapers/Pastel-Window.png) --transition-type fade --transition-duration 2 --transition-fps 60
exec-once = hypridle
exec-once = ~/.local/bin/battery-monitor
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
